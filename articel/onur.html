<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel-Blog</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    * {
      margin: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    header {
      background-color: rgba(78, 164, 135, 1);
      width: 100%;
      height: auto;
      display: flex;
    }
    menu {
      display: flex;
      align-items: center;
      color: white;
    }
    menu img {
      padding: 32px 100px 32px 140px;
    }
    nav {
      display: flex;
      gap: 72px;
    }
    nav a {
      color: white;
      font-family: "Arima";
      font-weight: 700;
      font-size: 1.5rem;
      text-decoration: none;
    }
    nav a:hover{
        color: red;
    }
    
  </style>

  <body>
    <header>
      <menu>
        <img src="./assets./icons./logo 03 1.png" alt="LOgo" />
        <nav>
          <a href="">Highligts</a>
          <a href="">FAQ</a>
          <a href="">Contact</a>
        </nav>
      </menu>
    </header>
  </body>
</html>
