<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog</title>
    <link rel="stylesheet" href="./style/font-style.css" />
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <section class="landing-section">
      <header>
        <nav></nav>
      </header>
    </section>
    <main>
      <section class="highligts">
        <div class="highligts-head">
          <img src="./assets/icons/rocket_launch.png" alt="Rocket" />
          <h2>Highligts</h2>
        </div>
        <p>
          From the vibrant cultures of Asia to the sun-drenched islands of the
          Caribbean and the serene landscapes of Scandinavia, each destination
          offers a distinct way to explore the world.
        </p>
        <div class="slider">
          <input type="radio" name="slider" value="Artur" checked/>
          <input type="radio" name="slider" value="David" />
          <input type="radio" name="slider" value="Onur" />

          <div class="slider-wrapper">
            <div class="slider-element element-Artur"></div>
            <div class="slider-element element-David"></div>
            <div class="slider-element element-Onur"></div>
          </div>
        </div>
      </section>
      <section class="faq">
        <h2>FAQ</h2>
      </section>
      <section class="contact"></section>
    </main>
    <footer>
      <div class="footer-left int-links">
        <div class="copyright">
          <img src="./assets/icons/copyright.svg" alt="copyright icon" />
          <p>Travel Blog 2026</p>
        </div>
        <a href="">Imprint</a>
        <a href="">Cookie Preference</a>
      </div>
      <div class="footer-right ext-links">
        <a href="https://tiktok.com" target="_blank"
          ><img src="./assets/icons/Tiktok_icon.svg" alt="TikTok icon"
        /></a>
        <a href="https://youtube.com" target="_blank"
          ><img
            src="./assets/icons/youtube_icon.svg"
            alt="Youtube icon"
            class="youtube-img"
        /></a>
        <a href="https://facebook.com" target="_blank"
          ><img src="./assets/icons/facebook_icon.svg" alt="Facebook icon"
        /></a>
        <a href="https://instagram.com" target="_blank"
          ><img src="./assets/icons/instagram_icon.svg" alt="instagram icon"
        /></a>
      </div>
    </footer>
  </body>
</html>
